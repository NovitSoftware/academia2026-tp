[project]
name = "planta-contrato"
version = "0.2.0"
description = "Contrato de integración con la planta simulada de la Academia Novit 2026"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["planta_contrato"]
