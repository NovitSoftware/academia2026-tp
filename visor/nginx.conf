# El visor y la API de la planta en el mismo origen: así anda igual por http://localhost:8080 que
# detrás del HTTPS de Caddy (desde un celular), sin contenido mixto ni CORS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # El visor 2D: el mismo sitio, pero en el 8081 la raíz abre el plano en lugar del 3D.
    listen 8081;
    root /usr/share/nginx/html;
    # Las notas grabadas en el celular pueden pesar varios MB, y las fotos más.
    client_max_body_size 60m;

    location = / {
        if ($server_port = 8081) {
            rewrite ^ /plano.html last;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ ^/(api|media|grabaciones)/ {
        proxy_pass http://sim:8100;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /ws {
        proxy_pass http://sim:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
